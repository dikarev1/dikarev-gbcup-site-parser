name: GymBreeze Parser

on:
  # Настройка расписания: скрипт будет запускаться каждые 30 минут
  schedule:
    - cron: '*/5 * * * *'
  # Позволяет запускать скрипт вручную кнопкой с сайта GitHub
  workflow_dispatch:

jobs:
  run-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python parser.py

      - name: Commit and push changes if hash updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add target_hash.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update site hash" && git push)
